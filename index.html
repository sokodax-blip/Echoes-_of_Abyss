<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>境界の残響 - ECHOES OF THE ABYSS -</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03040b;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
</style></head><body><div id="sa" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div><canvas id="c"></canvas>
<script>
"use strict";
/* ===== 境界の残響 - ECHOES OF THE ABYSS - 試作品 =====
   構成: 設定 / 入力 / 生成 / 更新 / ボス / 描画 / UI / ループ  (機能追加しやすいよう関数分割) */
const FW=480,FH=720,cv=document.getElementById('c'),cx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),Q=Math.PI*2;
let W,H,dpr,S,OX,OY,R=48,btns={},SA={t:0,r:0,b:0,l:0};
function readSA(){const d=document.getElementById('sa');if(!d)return;const c=getComputedStyle(d);SA={t:parseFloat(c.paddingTop)||0,r:parseFloat(c.paddingRight)||0,b:parseFloat(c.paddingBottom)||0,l:parseFloat(c.paddingLeft)||0}}
const keys={},tp=new Map();
let GM='normal',NSTG=0,nsel=0,msel=1,CHI=0,sel=0,DC=[],stage=0,SC={score:0,lives:2,bombs:3},state='title',uiLock=0,TG=0,scroll=0,shake=0;
let bul=[],lz=[],pb=[],en=[],pt=[],P,lives,score,bombs,gauge,abilT,bombT,T,wi,boss,slow=1,hi=0,bonus=0,wrn=0;
try{hi=+localStorage.getItem('echoHi')||0}catch(e){}

/* ---------- 画面サイズ ---------- */
function resize(){readSA();dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;S=Math.min(W/FW,H/FH);OX=(W-FW*S)/2;OY=(H-FH*S)/2;
 R=Math.max(38,Math.min(64,Math.min(W,H)*.085));const m=24;
 btns={shot:{x:W-1.7*R,y:H-m-1.9*R,r:1.3*R,l:'SHOT',c:'#ff2e88'},
  focus:{x:W-4.3*R,y:H-m-1.3*R,r:.95*R,l:'集中',c:'#18f0ff'},
  bomb:{x:W-1.5*R,y:H-m-4.7*R,r:.9*R,l:'BOMB',c:'#ffe14a'},
  abil:{x:W-3.8*R,y:H-m-3.6*R,r:.9*R,l:'異能',c:'#a56bff'}};}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

/* ---------- 入力(マルチタッチ) ---------- */
['touchstart','touchmove','gesturestart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 const x=e.clientX,y=e.clientY;
 if(state!=='play'){uiTap(x,y);return}
 let role=null;
 for(const k in btns){const b=btns[k];if(Math.hypot(x-b.x,y-b.y)<b.r*1.2){role=k;break}}
 if(!role){const[bx,by]=toField(x,y);if(bx>TBTN.x-16&&bx<TBTN.x+TBTN.w+10&&by>TBTN.y-6&&by<TBTN.y+TBTN.h+14){askBack();return}}
 if(!role&&x<W*.5)role='joy';
 if(!role)return;
 tp.set(e.pointerId,{role,sx:x,sy:y,x,y});
 if(role==='bomb')doBomb();if(role==='abil')doAbil();});
cv.addEventListener('pointermove',e=>{e.preventDefault();const t=tp.get(e.pointerId);if(t){t.x=e.clientX;t.y=e.clientY}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>tp.delete(e.pointerId)));
addEventListener('blur',()=>tp.clear());
addEventListener('keydown',e=>{keys[e.key]=1;const k=e.key;
 if(state==='title'){if(k==='ArrowUp'||k==='ArrowDown')msel^=1;else if(k==='Enter')modeGo(msel)}
 else if(state==='stagesel'){const n=STG.length;if(k==='ArrowLeft'&&nsel%2)nsel--;else if(k==='ArrowRight'&&nsel%2==0&&nsel+1<n)nsel++;else if(k==='ArrowUp'&&nsel>=2)nsel-=2;else if(k==='ArrowDown'&&nsel+2<n)nsel+=2;else if(k==='Enter'||k===' ')stageGo(nsel);else if(k==='Escape')toTitle()}
 else if(state==='select'){if(k==='Enter'){CHI=sel;start(GM==='normal'?NSTG:0)}else if(k==='ArrowRight'||k==='ArrowLeft'){const r=ROSTER,i=r.indexOf(sel);sel=r[(i+(k==='ArrowRight'?1:r.length-1))%r.length]}else if(k==='Escape')selBack()}
 else if(state==='confirm'){if(k==='Escape'||k==='Enter')resume()}
 if(state==='play'){if(k==='x'||k==='X')doBomb();if(k==='c'||k==='C')doAbil();if(k==='Escape'||k==='p'||k==='P')askBack()}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key]=0);
function readInput(){let mx=0,my=0,shot=false,focus=false;
 for(const t of tp.values()){
  if(t.role==='joy'){const m=R*1.15;let dx=(t.x-t.sx)/m,dy=(t.y-t.sy)/m;const d=Math.hypot(dx,dy);
   if(d>1){dx/=d;dy/=d}if(d>.08){mx+=dx;my+=dy}}
  else if(t.role==='shot')shot=true;else if(t.role==='focus'){focus=true;shot=true}}
 mx+=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
 my+=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 if(keys.z||keys.Z||keys[' '])shot=true;if(keys.Shift)focus=true;
 return{mx,my,shot,focus};}
function toField(x,y){return[(x-OX)/S,(y-OY)/S]}
function toTitle(){state='title';uiLock=0}
function modeGo(i){GM=i===0?'challenge':'normal';uiLock=0;if(GM==='challenge'){state='select';sel=CHI}else{state='stagesel';nsel=NSTG}}
function stageGo(i){NSTG=i;state='select';uiLock=0;sel=CHI}
function selBack(){if(GM==='normal'){state='stagesel';uiLock=0}else toTitle()}
function askBack(){if(state!=='play')return;state='confirm';uiLock=0;tp.clear()}
function resume(){if(state!=='confirm')return;state='play';uiLock=0;tp.clear()}
function endBtns(){const L=[];
 if(GM==='challenge'){if(state==='clear'&&stage<STG.length-1)L.push(['次のステージへ',()=>start(stage+1,{score,lives,bombs:3})]);L.push(['タイトルへ',toTitle])}
 else{L.push([state==='clear'?'もう一度プレイ':'リトライ',()=>start(stage,{score:0,lives:2,bombs:3})]);L.push(['ステージ選択へ',()=>{state='stagesel';nsel=stage;uiLock=0}]);L.push(['タイトルへ',toTitle])}
 return L}
function rowAt(fy){return fy>430&&fy<486?0:fy>505&&fy<561?1:fy>580&&fy<636?2:-1}
function titleL(){const vw=W/S,vh=H/S,sl=SA.l/S,sr=SA.r/S,st=SA.t/S,sb=SA.b/S;
 const mL=Math.max(24,vw*.04)+sl,tsz=Math.max(60,Math.min(100,vw*.075)),ty=Math.max(vh*.14,st+tsz*.9);
 const ps=clamp(vh*.06,36,60),mw=Math.min(460,Math.max(230,vw*.36)),ms=Math.min(clamp(vh*.035,22,34),mw/8.8);
 const lr=vw-Math.max(12,vw*.01)-sr,ll=lr-mw,cxm=(ll+lr)/2,py=vh*.555,ly=py+ps*.75,ny=ly+vh*.075,chy=ny+vh*.11;
 const rx=Math.max(130,vw*.28),ry=vh*.56,ks=clamp((ll-rx-16)/190,.4,.95);
 return{vw,vh,mL,tsz,ty,ps,ms,lr,ll,cxm,py,ly,ny,chy,rx,ry,ks,sb}}
function titleTap(vx,vy){const L=titleL(),h=Math.min(L.vh*.05,(L.chy-L.ny)/2-2);
 if(vx>L.ll-24&&vx<L.lr+12){if(Math.abs(vy-L.ny)<h)modeGo(1);else if(Math.abs(vy-L.chy)<h)modeGo(0)}}
function stgRect(i){const n=STG.length,rows=Math.ceil(n/2),gap=12,h=Math.min(172,(536-(rows-1)*gap)/rows);return{x:32+(i%2)*216,y:96+(i>>1)*(h+gap),w:200,h}}
function stageTap(fx,fy){for(let i=0;i<STG.length;i++){const R=stgRect(i);if(fx>R.x&&fx<R.x+R.w&&fy>R.y&&fy<R.y+R.h){nsel=i;stageGo(i);return}}
 if(fy>640&&fy<700&&fx>20&&fx<170)toTitle()}
function uiTap(x,y){if(uiLock<25)return;const[fx,fy]=toField(x,y);
 if(state==='title')titleTap(x/S,y/S);
 else if(state==='stagesel')stageTap(fx,fy);
 else if(state==='select')selTap(fx,fy);
 else if(state==='confirm'){if(fx>60&&fx<420){const r=rowAt(fy);if(r===0)resume();else if(r===1)toTitle()}}
 else if(fx>60&&fx<420){const b=endBtns()[rowAt(fy)];if(b)b[1]()}}

/* ---------- スプライト ---------- */
const SPC=['#ff3d6e','#3de0ff','#ffd23d','#a66bff','#7dff8a','#ff7be8'];
const SP=SPC.map(col=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
 const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#fff');gr.addColorStop(.28,col);gr.addColorStop(.6,col+'66');gr.addColorStop(1,col+'00');
 g.fillStyle=gr;g.fillRect(0,0,64,64);return c});
function glow(x,y,s,c){cx.drawImage(SP[c],x-s/2,y-s/2,s,s)}

/* ---------- 背景(夜の都市タイル) ---------- */
const tile=document.createElement('canvas');tile.width=FW;tile.height=FH;
(function(){const g=tile.getContext('2d');g.fillStyle='#04060f';g.fillRect(0,0,FW,FH);
 for(let r=0;r<6;r++)for(let c=0;c<4;c++){const bx=c*120+28,by=r*120+28,bw=92,bh=92,n=1+(Math.random()*3|0);let x0=bx;
  for(let i=0;i<n;i++){const w=i===n-1?bx+bw-x0:bw/n;
   g.fillStyle=`hsl(${rnd(220,250)},${rnd(25,40)}%,${rnd(6,11)}%)`;g.fillRect(x0+1,by+1,w-2,bh-2);
   g.fillStyle='rgba(255,255,255,.025)';g.fillRect(x0+4,by+4,w-8,bh-8);
   for(let wy=by+8;wy<by+bh-8;wy+=8)for(let wx=x0+7;wx<x0+w-9;wx+=8)if(Math.random()<.1){
    g.fillStyle=Math.random()<.7?'rgba(255,214,120,.5)':'rgba(120,220,255,.45)';g.fillRect(wx,wy,3,4)}
   if(Math.random()<.12){g.strokeStyle=Math.random()<.5?'#7a3f6e':'#35607f';g.globalAlpha=.35;g.lineWidth=1.5;g.strokeRect(x0+2,by+2,w-4,bh-4);g.globalAlpha=1}
   x0+=w}}
 g.strokeStyle='rgba(255,200,90,.14)';g.lineWidth=1.5;g.setLineDash([10,10]);
 for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,i*120+14);g.lineTo(FW,i*120+14);g.stroke()}
 for(let i=0;i<4;i++){g.beginPath();g.moveTo(i*120+14,0);g.lineTo(i*120+14,FH);g.stroke()}})();
function drawBg(){const ys=scroll%FH;cx.drawImage(tile,0,ys-FH);cx.drawImage(tile,0,ys);
 cx.globalCompositeOperation='lighter';
 for(let r=0;r<6;r++){const y=((r*120+14+scroll)%FH);for(let i=0;i<3;i++){
  const d=(r%2?1:-1),x=(((TG*(1.2+r*.25)*d+r*97+i*160)%FW)+FW)%FW;cx.globalAlpha=.4;glow(x,y,9,(r+i)%2?2:0);cx.globalAlpha=1}}
 cx.globalCompositeOperation='source-over';
 const gr=cx.createLinearGradient(0,0,0,FH);gr.addColorStop(0,'rgba(8,12,45,.55)');gr.addColorStop(1,'rgba(8,12,45,0)');cx.fillStyle=gr;cx.fillRect(0,0,FW,FH);
 cx.fillStyle='rgba(2,4,16,.3)';cx.fillRect(0,0,FW,FH);cx.strokeStyle='rgba(170,200,255,.09)';cx.lineWidth=1;cx.beginPath();
 for(let i=0;i<40;i++){const x=(i*53+TG*1.2)%FW,y=(i*91+TG*14)%FH;cx.moveTo(x,y);cx.lineTo(x-3,y+14)}cx.stroke();}

/* ---------- 生成 ---------- */
function eb(x,y,a,s,c,r,w,sh){if(bul.length>=2600)return null;const st=STYLE[stage][c]||STYLE[stage][0],R=r||5,b={x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:R,h:R*.7,c,g:0,w:w||0,sh:sh===undefined?st[0]:sh,k:st[1],rt:Math.random()*Q};bul.push(b);return b}
function spark(x,y,n,col,sp,sz){for(let i=0;i<n&&pt.length<500;i++){const a=rnd(0,Q),s=rnd(.3,1)*(sp||3);
 pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(20,40),m:40,c:col,s:sz||3})}}
function clearB(sc){for(const b of bul){if(sc)score+=3;if(Math.random()<.15)spark(b.x,b.y,1,CL[b.k],1.5,2)}bul.length=0;lz.length=0}
let WV=[];
for(let i=0;i<6;i++)WV.push([120+i*24,'a',70+i*58,0]);
for(let i=0;i<6;i++)WV.push([420+i*24,'a',410-i*58,Math.PI]);
WV.push([700,'b',130,0],[780,'b',350,0]);
for(let i=0;i<5;i++)WV.push([1000+i*30,'a',60+i*90,i]);
WV.push([1150,'c',240,0],[1500,'b',90,0],[1500,'b',390,0]);
for(let i=0;i<8;i++)WV.push([1620+i*22,'a',i%2?100:380,i]);
WV.push([1900,'c',120,0],[1900,'c',360,0]);WV.sort((a,b)=>a[0]-b[0]);
const WV1=WV;let BT=2500;
function spawn(k,x,ph){const d={a:{hp:4,r:14,y:-20},b:{hp:24,r:18,y:-30},c:{hp:70,r:24,y:-40},d:{hp:7,r:15,y:-20},e:{hp:30,r:20,y:-30},f:{hp:95,r:26,y:-40},g:{hp:8,r:15,y:-20},h:{hp:34,r:20,y:-30},i:{hp:110,r:27,y:-40},j:{hp:9,r:15,y:-20},k:{hp:42,r:20,y:-30},l:{hp:125,r:28,y:-40},m:{hp:10,r:15,y:-20},n:{hp:50,r:21,y:-30},o:{hp:145,r:29,y:-40},p:{hp:11,r:15,y:-20},q:{hp:56,r:21,y:-30},r:{hp:165,r:29,y:-40}}[k];
 en.push({k,x,y:d.y,x0:x,hp:d.hp,mh:d.hp,r:d.r,t:0,ph,fl:0})}
function start(st,c){stage=st||0;c=c||{score:0,lives:2,bombs:3};SC={score:c.score,lives:c.lives,bombs:c.bombs};WV=STG[stage].waves;BT=STG[stage].bt;bul=[];lz=[];pb=[];en=[];pt=[];P={x:FW/2,y:FH-110,hp:3,mhp:3,inv:120,fc:0};lives=c.lives;score=c.score;bombs=c.bombs;gauge=0;abilT=0;bombT=0;
 T=0;wi=0;boss=null;slow=1;wrn=0;tp.clear();state='play';uiLock=0}
function sav(){if(score>hi){hi=score;try{localStorage.setItem('echoHi',hi)}catch(e){}}}
function doBomb(){if(state==='play'&&bombs>0&&bombT<=0&&!(boss&&boss.dead)){bombs--;bombT=120;P.inv=Math.max(P.inv,130);shake=10}}
function doAbil(){if(state==='play'&&gauge>=100&&abilT<=0){abilT=360;gauge=0;shake=6;spark(P.x,P.y,30,'#5de0ff',5,3)}}
function hurt(){P.hp--;shake=12;spark(P.x,P.y,30,'#ff6a8a',5,3);P.inv=130;clearB(false);
 if(P.hp<=0){lives--;if(lives<0){state='over';uiLock=0;sav();return}P.hp=P.mhp;P.inv=200;bombs=3}}
function endClear(){bonus=lives*20000+bombs*5000+P.hp*3000;score+=bonus;sav();state='clear';uiLock=0}

/* ---------- 敵の更新 ---------- */
function updEn(e){e.t++;if(e.fl>0)e.fl--;if(e.k>'o')return updEn6(e);if(e.k>'l')return updEn5(e);if(e.k>'i')return updEn4(e);if(e.k>'f')return updEn3(e);if(e.k>'c')return updEn2(e);
 if(e.k==='a'){e.y+=1.9;e.x=e.x0+Math.sin(e.t*.045+e.ph)*60;
  if(e.t%65==40&&e.y>20&&e.y<500)eb(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),3.2,0)}
 else if(e.k==='b'){if(e.t<70)e.y+=1.6;else if(e.t>420)e.y-=1.4;
  if(e.t>70&&e.t%80==0){const o=e.t*.3;for(let i=0;i<12;i++)eb(e.x,e.y,o+i*Math.PI/6,2.2,1)}
  if(e.t>70&&e.t%240==160)ring(e.x,e.y,16,e.t,2.0,3,5,0,3)}
 else{if(e.t<80)e.y+=1.3;else if(e.t>600)e.y-=1.2;e.x=e.x0+Math.sin(e.t*.02)*40;
  if(e.t>80&&e.t%55==0){const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=-2;i<=2;i++)eb(e.x,e.y,a+i*.2,3,2,6)}
  if(e.t>80&&e.t%170==0)for(let i=0;i<20;i++)eb(e.x,e.y,i*Math.PI/10+e.t,1.8,3);
  if(e.t>80&&e.t%240==120)line(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),3.2,2,6,5);
  if(e.t>200&&e.t%300==200)laser(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),{wr:50,life:40,w:12,k:2})}
 return(e.y<-60&&e.t>100)||e.y>FH+40}

/* ---------- ボス ---------- */
const PN=['夜景の螺旋 ― 静止した街','止まらぬ秒針 ― 刻の断層','境界崩壊 ― 残響の底'];
function mkBoss(){const h=[1500,1900,2300,2700,3100,3600][stage];boss={x:FW/2,y:-80,hp:h,mh:h,r:36,t:0,ph:0,on:false,inv:0,fl:0,ban:0,dead:0}}
function updBoss(){const B=boss;
 if(B.dead){B.dead++;if(B.dead%6==0)spark(B.x+rnd(-40,40),B.y+rnd(-40,40),14,stage===5?'#ff3d6e':stage===4?'#c7a6ff':stage===3?'#3dffb0':stage?'#ff7be8':'#ffd23d',5,4);if(B.dead===150)endClear();return}
 B.t++;if(B.fl>0)B.fl--;
 if(!B.on){B.y+=1.6;if(B.y>=130){B.on=true;B.t=0;B.ban=150;B.inv=60}return}
 if(B.hp<=0){B.dead=1;clearB(true);score+=20000;P.inv=Math.max(P.inv,400);shake=20;spark(B.x,B.y,60,'#fff',7,4);return}
 const np=B.hp>B.mh*.66?0:B.hp>B.mh*.33?1:2;
 if(np!==B.ph){B.ph=np;B.t=0;B.ban=150;B.inv=100;clearB(true);shake=14;spark(B.x,B.y,40,'#fff',6,4)}
 if(B.ban>0)B.ban--;
 if(stage===5)mov6(B);else if(stage===4)mov5(B);else if(stage===3)mov4(B);else if(stage===2)mov3(B);else if(stage)mov2(B);else{B.x=FW/2+Math.sin(B.t*.012+B.ph)*(B.ph===1?150:90);B.y=130+Math.sin(B.t*.02)*12}
 if(B.inv>0){B.inv--;return}
 if(stage===5){pat6(B);return}if(stage===4){pat5(B);return}if(stage===3){pat4(B);return}if(stage===2){pat3(B);return}if(stage){pat2(B);return}
 const t=B.t,x=B.x,y=B.y,aim=Math.atan2(P.y-y,P.x-x);
 if(B.ph===0){
  if(t%5==0)for(let k=0;k<3;k++)eb(x,y,t*.09+k*Q/3,2.3,0);
  if(t%100==0)for(let k=-3;k<=3;k++)eb(x,y,aim+k*.17,3.1,1,5);
  if(t%160==0)for(let k=0;k<22;k++)eb(x,y,k*Q/22,1.7,3,6);
  if(t%150==75)flower(x,y,30,5,t*.05,1.5,4);if(t%190==20)line(x,y,aim,3.2,2,6,5)}
 else if(B.ph===1){
  if(t%4==0){const a=t*.045;for(let k=0;k<4;k++)eb(x,y,a+k*Q/4,2.6,k%2?2:4)}
  if(t%120==0)for(let k=0;k<28;k++)eb(x,y,k*Q/28+t,1.9,0,6);
  if(t%70==0)for(let k=-1;k<=1;k++)eb(x,y,aim+k*.2,3.5,1);
  if(t%150==50)wave(x,y,aim,4,2.6,1,.03);
  if(t%360==100){laser(x,y,aim,{wr:55,life:70,w:14,k:2,av:.018});laser(x,y,aim+Math.PI,{wr:55,life:70,w:14,k:2,av:.018})}}
 else{const d=(t/220|0)%2?-1:1;
  if(t%3==0){const a=d*t*.07;for(let k=0;k<5;k++)eb(x,y,a+k*Q/5,2+(t%9)*.06,k%2?0:3)}
  if(t%9==0)eb(rnd(10,FW-10),-8,Math.PI/2,2.4,1,4);
  if(t%140==0)for(let k=0;k<32;k++)eb(x,y,k*Q/32,1.4,3,6);
  if(t%200==0)for(let k=-3;k<=3;k++)eb(x,y,aim+k*.14,3.6,2,6);
  if(t%110==0)for(let k=0;k<12;k++)turn(x,y,k*Q/12+t,2.4,5,40,1.4,1.4);
  if(t%420==200)for(let k=-1;k<=1;k++)laser(x,y,aim+k*.55,{wr:50,life:45,w:12,k:0})}}

/* ---------- メイン更新(固定60Hz) ---------- */
function update(){uiLock++;TG++;
 for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;if(--p.l<=0)pt.splice(i,1)}
 if(shake>0)shake*=.88;if(shake<.3)shake=0;
 if(state!=='play'){scroll+=state==='title'?1:.5;return}
 scroll+=1.2;T++;
 const inp=readInput(),foc=inp.focus,sp=(foc?2.2:4.6)*CH[CHI].spd;let mx=inp.mx,my=inp.my;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 P.x=clamp(P.x+mx*sp,14,FW-14);P.y=clamp(P.y+my*sp,20,FH-20);if(P.inv>0)P.inv--;updDc(foc);
 /* ショット */
 if(P.fc>0)P.fc--;
 if(inp.shot&&P.fc<=0&&!(boss&&boss.dead)){P.fc=CH[CHI].rate*(abilT>0&&CH[CHI].rt||1);if(CHI)fire(foc);else
  if(foc){pb.push({x:P.x-5,y:P.y-12,vx:0,vy:-16,d:2.2},{x:P.x+5,y:P.y-12,vx:0,vy:-16,d:2.2})}
  else{pb.push({x:P.x,y:P.y-14,vx:0,vy:-15,d:1},{x:P.x-8,y:P.y-8,vx:-2.2,vy:-14,d:1},{x:P.x+8,y:P.y-8,vx:2.2,vy:-14,d:1})}}
 /* 異能・ボム */
 if(abilT>0)abilT--;slow+=((abilT>0?CH[CHI].sl:1)-slow)*.15;
 if(bombT>0){bombT--;P.inv=Math.max(P.inv,2);clearB(true);
  for(const e of en){e.hp-=1.5*CH[CHI].bd;e.fl=2}
  if(boss&&boss.on&&boss.inv<=0&&!boss.dead){boss.hp-=1.2*CH[CHI].bd;boss.fl=2}}
 /* 出現 */
 while(wi<WV.length&&WV[wi][0]<=T){spawn(WV[wi][1],WV[wi][2],WV[wi][3]);wi++}
 if(T===BT-150)wrn=150;if(wrn>0)wrn--;
 if(T===BT&&!boss)mkBoss();
 /* 自弾 */
 for(let i=pb.length-1;i>=0;i--){const b=pb[i];stepPb(b);if(b.life!==undefined&&--b.life<0){pb.splice(i,1);continue}
  if(b.y<-30||b.y>FH+30||b.x<-30||b.x>FW+30){pb.splice(i,1);continue}
  let hit=false;
  for(const e of en)if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+(b.cr||4)){e.hp-=b.d;e.fl=3;hit=true;break}
  if(!hit&&boss&&boss.on&&!boss.dead&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+(b.cr||5)){
   if(boss.inv<=0){boss.hp-=b.d;score+=2;if(abilT<=0)gauge=Math.min(100,gauge+.03)}boss.fl=3;hit=true}
  if(hit){spark(b.x,b.y,2,'#9ff',2,2);if(!b.pi)pb.splice(i,1)}}
 /* 敵 */
 let hitF=false;
 for(let i=en.length-1;i>=0;i--){const e=en[i];
  if(e.hp<=0){score+={a:200,b:800,c:2500,d:300,e:1000,f:3000,g:350,h:1200,i:3500,j:400,k:1300,l:3800,m:450,n:1400,o:4000,p:500,q:1500,r:4200}[e.k];if(abilT<=0)gauge=Math.min(100,gauge+4);spark(e.x,e.y,22,'#ffd23d',4,3);en.splice(i,1);continue}
  if(updEn(e)){en.splice(i,1);continue}
  if(P.inv<=0&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+5)hitF=true}
 if(boss)updBoss();
 /* 敵弾(異能で減速) */
 for(let i=bul.length-1;i>=0;i--){const b=bul[i];
  if(b.dl>0)b.dl-=slow;else{
   if(b.cf>0&&(b.cf-=slow)<=0){const a=Math.atan2(b.vy,b.vx)+b.ca,s=Math.hypot(b.vx,b.vy)*b.cs;b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s}
   const wr=(b.w||0)+(b.ww?b.ww*Math.cos((b.t=(b.t||0)+slow)*.09):0);
   if(wr){const ca=Math.cos(wr*slow),sa=Math.sin(wr*slow),nx=b.vx*ca-b.vy*sa;b.vy=b.vx*sa+b.vy*ca;b.vx=nx}
   if(b.tg>0){b.tg-=slow;const a=Math.atan2(b.vy,b.vx);let d=Math.atan2(P.y-b.y,P.x-b.x)-a;d=Math.atan2(Math.sin(d),Math.cos(d));const na=a+clamp(d,-.04,.04)*slow,s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s}
   b.x+=b.vx*slow;b.y+=b.vy*slow}
  
  if(b.x<-30||b.x>FW+30||b.y<-30||b.y>FH+30){bul[i]=bul[bul.length-1];bul.pop();continue}
  const d=(b.x-P.x)**2+(b.y-P.y)**2;
  if(d<(b.h+3)**2){if(P.inv<=0)hitF=true}
  else if(!b.g&&d<(b.r+15)**2){b.g=1;score+=10;if(abilT<=0)gauge=Math.min(100,gauge+.8)}}
 if(updLz())hitF=true;if(hitF&&state==='play')hurt();}
