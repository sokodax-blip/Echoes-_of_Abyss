 else if(state==='stagesel'){const n=NSN,c=stgCols();if(k==='ArrowLeft'&&nsel%c)nsel--;else if(k==='ArrowRight'&&nsel%c<c-1&&nsel+1<n)nsel++;else if(k==='ArrowUp'&&nsel>=c)nsel-=c;else if(k==='ArrowDown'&&nsel+c<n)nsel+=c;else if(k==='Enter'||k===' ')stageGo(nsel);else if(k==='Escape')toTitle()}

function titleL(){const vw=W/S,vh=H/S,sl=SA.l/S,sr=SA.r/S,st=SA.t/S,sb=SA.b/S;

 const lr=vw-Math.max(12,vw*.01)-sr,ll=lr-mw,cxm=(ll+lr)/2,py=vh*(exUnl?.46:.555),ly=py+ps*.75,ny=ly+vh*(exUnl?.065:.075),gp=vh*(exUnl?.088:.11),chy=ny+gp,exy=chy+gp;

 return{vw,vh,mL,tsz,ty,ps,ms,lr,ll,cxm,py,ly,ny,chy,exy,pry:exUnl?exy+gp:exy,rx,ry,ks,sb}}

 {const R=cardBtnRect(L);if(vx>R.x&&vx<R.x+R.w&&vy>R.y&&vy<R.y+R.h){cardGo();return}}
 {const R=rpBtnRect(L);if(vx>R.x&&vx<R.x+R.w&&vy>R.y&&vy<R.y+R.h){rpListGo();return}}
 {const R=gwBtnRect(L);if(vx>R.x&&vx<R.x+R.w&&vy>R.y&&vy<R.y+R.h){gFrom='title';gsel=CHI;gRst=0;state='grow';uiLock=0;return}}
 {const R=setBtnRect(L);if(vx>R.x&&vx<R.x+R.w&&vy>R.y&&vy<R.y+R.h){openSet('title');return}}
 if(vx>L.mL-10&&vx<L.mL+L.tsz*5&&vy>L.ty-L.tsz*.6&&vy<L.ty+L.tsz*.5){const n=performance.now();admTaps=admTaps.filter(t=>n-t<3000);admTaps.push(n);if(admTaps.length>=5){admTaps=[];admOpen();return}}

 const p=abP(e,ci);return ci===0?'敵弾減速 '+Math.round((1-p.sl)*100)+'%':ci===4?'透過時間の延長のみ':ci===5?'バリア1回 / 持続のみ':ci===6?'ボム+2 / 威力 ×'+p.dm.toFixed(2):ci===3?'分身弾の威力 ×'+p.dm.toFixed(2):ci===1?'攻撃力 ×'+p.dm.toFixed(2):'威力 ×'+p.dm.toFixed(2)+' / 連射 ×'+(1/p.rt).toFixed(2)}

/* ---------- 管理者画面(タイトルのロゴを3秒以内に5回タップ / PCはF9) ---------- */
let ADM={god:0,bomb:0,gauge:0},admMsg='',admS=0,admC=0,admArm=0,admTaps=[];
function admOn(){return ADM.god||ADM.bomb||ADM.gauge}
function admOpen(){if(state!=='title')return;admMsg='';admArm=0;admC=CHI;state='admin';uiLock=0}
function admItems(){const u=U(),x=(u.vw-480)/2,y0=64+u.t,it=[],add=(id,xx,yy,w,h)=>it.push({id,x:xx,y:yy,w,h});
 add('god',x,y0,480,44);add('bomb',x,y0+52,480,44);add('gauge',x,y0+104,480,44);
 const sy=y0+196;add('sm',x,sy,60,44);add('sp',x+420,sy,60,44);add('cm',x,sy+52,60,44);add('cp',x+420,sy+52,60,44);add('go',x,sy+104,480,48);
 const ay=sy+176;['ex','clr','pt','hi','ctl','all'].forEach((id,i)=>add(id,x+(i%2)*244,ay+Math.floor(i/2)*52,236,44));
 add('back',x,Math.min(ay+188,u.vh-60-u.b),200,50);return{it,x,sy,ay,u}}
function admGo(){GM=admS===EXI?'extra':'normal';hi=GM==='extra'?exHi:nHi;CHI=admC;NSTG=admS;start(admS,admS===EXI?{score:0,lives:0,bombs:0}:{score:0,lives:2,bombs:3})}
function admAct(id){
 if(id!=='all')admArm=0;
 if(id==='ex'){exUnl=true;try{localStorage.setItem('echoExUnl','1')}catch(e){}admMsg='EXTRAステージを開放しました'}
 else if(id==='clr'){chBest=NSN;try{localStorage.setItem('echoChBest',chBest)}catch(e){}admMsg='チャレンジの到達ステージを最大にしました'}
 else if(id==='pt'){GRW.forEach(g=>g.p=Math.min(999,g.p+10));gwSave();admMsg='全キャラに育成ポイント +10'}
 else if(id==='hi'){nHi=0;exHi=0;hi=0;try{localStorage.removeItem('echoHi');localStorage.removeItem('echoExHi')}catch(e){}admMsg='ハイスコアを消去しました'}
 else if(id==='ctl'){UC={};layoutBtns();ctlSave();admMsg='操作設定を初期化しました'}
 else if(id==='all'){if(!admArm){admArm=200;admMsg='もう一度タップすると全データを初期化します';return}
  try{Object.keys(localStorage).filter(k=>k.indexOf('echo')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}}
function admTap(vx,vy){const{it}=admItems();for(const b of it){if(vx>b.x&&vx<b.x+b.w&&vy>b.y&&vy<b.y+b.h){const id=b.id,n=NSN+1;
  if(id==='god'||id==='bomb'||id==='gauge')ADM[id]^=1;
  else if(id==='sm')admS=(admS+n-1)%n;else if(id==='sp')admS=(admS+1)%n;
  else if(id==='cm')admC=ROSTER[(ROSTER.indexOf(admC)+ROSTER.length-1)%ROSTER.length];else if(id==='cp')admC=ROSTER[(ROSTER.indexOf(admC)+1)%ROSTER.length];
  else if(id==='go')admGo();else if(id==='back')toTitle();else admAct(id);return}}}
function drawAdmin(){const{it,x,sy,ay,u}=admItems();bgFull('rgba(8,3,20,.8)');if(admArm>0&&--admArm===0)admMsg='';
 tgl('ADMIN',u.vw/2,28+u.t,26,'#ffe14a','center',900,2);
 const lbl={god:'無敵',bomb:'ボム無限',gauge:'異能ゲージ常時MAX'};
 for(const b of it){const id=b.id;
  if(lbl[id]){const on=ADM[id];plate(b.x,b.y,b.w,b.h,on?'#3dffb0':CP.dim,!!on,10);tx(lbl[id],b.x+20,b.y+22,17,'#fff','left',900);tx(on?'ON':'OFF',b.x+b.w-20,b.y+22,17,on?'#3dffb0':CP.dim,'right',900)}
  else if(id==='sm'||id==='sp'||id==='cm'||id==='cp')btn2(b.x,b.y,b.w,b.h,id[1]==='m'?'◀':'▶','#9ab');
  else if(id==='go')btn2(b.x,b.y,b.w,b.h,'このステージから開始','#8fe8ff');
  else if(id==='back')btn2(b.x,b.y,b.w,b.h,'戻る','#9ab');
  else{const nm={ex:'EXTRA開放',clr:'全ステージ解放',pt:'育成pt +10',hi:'ハイスコア消去',ctl:'操作設定リセット',all:admArm>0?'本当に初期化?':'全データ初期化'}[id];
   plate(b.x,b.y,b.w,b.h,id==='all'?CP.mg:CP.yl,id==='all'&&admArm>0,8);tx(nm,b.x+b.w/2,b.y+22,16,'#fff','center',900)}}
 tx('ステージ / キャラ指定',x,sy-16,13,CP.dim,'left');
 tx(admS===EXI?'EXTRA STAGE':'STAGE '+(admS+1)+'  '+((STG[admS]&&STG[admS].sn)||''),x+240,sy+22,17,'#fff','center',900);
 tx(CH[admC].name+'  /  '+CH[admC].abn,x+240,sy+74,17,CH[admC].col,'center',900);
 tx(admOn()?'※チート有効中: ハイスコア・リプレイは記録されません':'チート設定はアプリを閉じると解除されます',u.vw/2,ay+158,12,admOn()?CP.mg:CP.dim);
 if(admMsg)tx(admMsg,u.vw/2,ay+174,13,CP.yl,'center',900)}
/* ---------- ループ ---------- */
let last=0,acc=0;
function frame(t){const dt=Math.min(t-last,100);last=t;acc+=dt;while(acc>=16.667){tick();acc-=16.667}draw();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
